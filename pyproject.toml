[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lythosle"
version = "0.1.0"
description = "Limit equilibrium slope stability analysis with a browser front end"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Hasan Deniz Altuntaş", email = "lythosfea@gmail.com" }]
keywords = [
  "geotechnical", "slope stability", "limit equilibrium", "factor of safety",
  "bishop", "janbu", "spencer", "morgenstern-price", "method of slices",
  "civil engineering", "geotechnics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
lythosle = "lythosle.cli:main"

[project.urls]
Homepage = "https://github.com/hdaltuntas/lythosle"
Source = "https://github.com/hdaltuntas/lythosle"
Repository = "https://github.com/hdaltuntas/lythosle"
Issues = "https://github.com/hdaltuntas/lythosle/issues"
Documentation = "https://github.com/hdaltuntas/lythosle/blob/main/docs/theory.md"
Validation = "https://github.com/hdaltuntas/lythosle/blob/main/README.md#validation"

[tool.setuptools.packages.find]
include = ["lythosle*"]

[tool.setuptools.package-data]
lythosle = ["web/static/*", "web/static/fonts/*"]
