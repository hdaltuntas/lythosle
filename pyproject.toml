[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lythosle"
version = "1.0.0"
description = "Limit equilibrium slope stability analysis with a browser front end"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["geotechnical", "slope stability", "limit equilibrium", "bishop",
            "spencer", "morgenstern-price", "factor of safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "uvicorn>=0.23"]

[project.scripts]
lythosle = "lythosle.cli:main"

[project.urls]
Source = "https://github.com/hdaltuntas/lythosle"

[tool.setuptools.packages.find]
include = ["lythosle*"]

[tool.setuptools.package-data]
lythosle = ["web/static/*"]
